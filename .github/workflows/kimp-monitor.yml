name: Kimchi Premium Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: kimp-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
     contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: >-
          python -I -m pip --isolated install --index-url https://pypi.org/simple
          --only-binary=:all: --require-hashes -r locks/runtime-linux.txt

      - name: Run monitor
        id: monitor
        env:
          RUN_MODE: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USDT_KIMP_LOW: ${{ vars.USDT_KIMP_LOW }}
          USDT_KIMP_HIGH: ${{ vars.USDT_KIMP_HIGH }}
          GOLD_KIMP_LOW: ${{ vars.GOLD_KIMP_LOW }}
          GOLD_KIMP_HIGH: ${{ vars.GOLD_KIMP_HIGH }}
        run: python -B monitor.py --live

      - name: Publish saved state even after a collection or delivery failure
        if: ${{ always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        env:
          KIMCHI_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B -S monitor.py --publish-only
